<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qui suis-je — {nom}</title>
  <meta name="description" content="Découvrez mon parcours et ce que je peux apporter à votre activité.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2324384f'/><path d='M30 52l14 14 26-30' stroke='%23c8734b' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body data-page="qui-suis-je">
  <header id="header"></header>

  <main>
    <section class="section">
      <div class="container about-inner">
        <div class="about-photo">
          <img data-img="a_propos.photo" src="/images/portrait.svg" alt="Portrait">
        </div>
        <div class="about-text">
          <span class="eyebrow" data-content="general.metier"></span>
          <h1 data-content="a_propos.titre"></h1>
          <p class="accroche" data-content="a_propos.accroche"></p>
          <p class="texte" data-content="a_propos.texte"></p>
        </div>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container">
        <div class="section-head">
          <h2>Ce que je vous apporte</h2>
        </div>
        <div class="grid-3" id="atouts-list"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="cta-band reveal">
          <h2>Et si vous déléguiez votre administratif ?</h2>
          <p>Parlez-moi de votre activité et des tâches qui vous pèsent. Le premier échange est l'occasion de voir ensemble ce que je peux prendre en charge.</p>
          <a href="/contact.html" class="btn btn-light">Me contacter</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="/js/main.js"></script>
</body>
</html>
