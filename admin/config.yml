# Configuration de l'interface d'administration (Decap CMS)
# Se connecter sur /admin pour modifier textes et photos.

backend:
  name: git-gateway
  branch: main

locale: fr

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "Contenu du site"
    files:
      - name: "contenu"
        label: "Textes et photos du site"
        file: "content/site.json"
        fields:
          - label: "Informations générales"
            name: "general"
            widget: "object"
            fields:
              - { label: "Nom ou nom commercial", name: "nom", widget: "string" }
              - { label: "Métier (sous le nom)", name: "metier", widget: "string" }
              - { label: "Téléphone", name: "telephone", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Ville", name: "ville", widget: "string" }
              - { label: "Zone d'intervention", name: "zone_intervention", widget: "string" }
              - { label: "Horaires", name: "horaires", widget: "string" }
              - { label: "Lien LinkedIn (facultatif)", name: "linkedin", widget: "string", required: false }
              - { label: "Lien de prise de rendez-vous (facultatif)", name: "lien_rendez_vous", widget: "string", required: false }

          - label: "Page d'accueil"
            name: "accueil"
            widget: "object"
            fields:
              - { label: "Titre principal", name: "titre", widget: "string" }
              - { label: "Sous-titre", name: "sous_titre", widget: "text" }
              - { label: "Texte du bouton", name: "bouton_texte", widget: "string" }
              - { label: "Titre « constats »", name: "constats_titre", widget: "string" }
              - label: "Constats (problèmes de vos clients)"
                name: "constats"
                widget: "list"
                summary: "{{fields.texte}}"
                fields:
                  - { label: "Texte", name: "texte", widget: "text" }
              - { label: "Titre « méthode »", name: "etapes_titre", widget: "string" }
              - label: "Étapes de la méthode"
                name: "etapes"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { label: "Titre", name: "titre", widget: "string" }
                  - { label: "Texte", name: "texte", widget: "text" }

          - label: "Qui suis-je"
            name: "a_propos"
            widget: "object"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image" }
              - { label: "Phrase d'accroche", name: "accroche", widget: "text" }
              - { label: "Parcours", name: "texte", widget: "text" }
              - label: "Atouts"
                name: "atouts"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { label: "Titre", name: "titre", widget: "string" }
                  - { label: "Texte", name: "texte", widget: "text" }

          - label: "Mes services"
            name: "services"
            widget: "object"
            fields:
              - { label: "Titre de la page", name: "titre", widget: "string" }
              - { label: "Introduction", name: "intro", widget: "text" }
              - label: "Services"
                name: "liste"
                widget: "list"
                summary: "{{fields.titre}}"
                fields:
                  - { label: "Nom du service", name: "titre", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
              - { label: "Modalités (comment je travaille)", name: "modalites", widget: "text" }
              - { label: "Afficher les tarifs", name: "afficher_tarifs", widget: "boolean", default: false }
              - { label: "Tarifs", name: "tarifs", widget: "text" }

          - label: "Page contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Texte d'introduction", name: "texte", widget: "text" }

          - label: "Livre d'or"
            name: "livre_dor"
            widget: "object"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Introduction", name: "intro", widget: "text" }
              - label: "Messages publiés"
                name: "messages"
                widget: "list"
                summary: "{{fields.nom}}"
                fields:
                  - { label: "Nom", name: "nom", widget: "string" }
                  - { label: "Entreprise ou activité", name: "entreprise", widget: "string", required: false }
                  - { label: "Message", name: "texte", widget: "text" }

          - label: "Mentions légales"
            name: "mentions_legales"
            widget: "object"
            fields:
              - { label: "Texte", name: "texte", widget: "text" }
