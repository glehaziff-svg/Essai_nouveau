<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livre d'or — {nom}</title>
  <meta name="description" content="Les témoignages de celles et ceux qui m'ont confié leur administratif.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231c1c1e'/><path d='M30 52l14 14 26-30' stroke='%23b08d3c' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body data-page="livre-dor">
  <header id="header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Témoignages</span>
        <h1 data-content="livre_dor.titre"></h1>
        <p class="lead" data-content="livre_dor.intro"></p>
      </div>
    </section>

    <section class="section" style="padding-top: 24px">
      <div class="container">
        <div class="messages" id="messages-list"></div>
        <p class="empty hidden" id="messages-empty">Le livre d'or attend son premier message. Vous avez travaillé avec moi ? Soyez le premier à témoigner.</p>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container">
        <div class="section-head">
          <h2>Laisser un message</h2>
          <p class="lead">Chaque message est relu avant d'être publié.</p>
        </div>
        <form class="form" name="livre-dor" method="POST" action="/merci.html" data-netlify="true" netlify-honeypot="bot-field" style="max-width: 680px">
          <input type="hidden" name="form-name" value="livre-dor">
          <p class="hidden"><label>Ne pas remplir : <input name="bot-field"></label></p>
          <label>Votre nom
            <input type="text" name="nom" autocomplete="name" required>
          </label>
          <label><span>Entreprise ou activité <span class="optional">(facultatif)</span></span>
            <input type="text" name="entreprise" autocomplete="organization">
          </label>
          <label>Votre message
            <textarea name="message" rows="5" required></textarea>
          </label>
          <label class="consent">
            <input type="checkbox" name="accord_publication" required>
            J'accepte que mon message et mon nom soient publiés sur ce site.
          </label>
          <button type="submit" class="btn btn-primary">Envoyer mon message</button>
        </form>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="/js/main.js"></script>
</body>
</html>
