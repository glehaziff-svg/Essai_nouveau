<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes services — {nom}</title>
  <meta name="description" content="Les tâches administratives que je peux prendre en charge pour vous.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231c1c1e'/><path d='M30 52l14 14 26-30' stroke='%23b08d3c' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body data-page="services">
  <header id="header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Secrétariat indépendant</span>
        <h1 data-content="services.titre"></h1>
        <p class="lead" data-content="services.intro"></p>
      </div>
    </section>

    <section class="section" style="padding-top: 24px">
      <div class="container">
        <div class="services-list" id="services-list"></div>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container grid-2">
        <div class="info-box reveal">
          <h3>Comment je travaille</h3>
          <p data-content="services.modalites"></p>
        </div>
        <div class="info-box reveal hidden" id="tarifs-box">
          <h3>Tarifs</h3>
          <p data-content="services.tarifs"></p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="cta-band reveal">
          <h2>Et si vous déléguiez votre administratif ?</h2>
          <p>Parlez-moi de votre activité et des tâches qui vous pèsent. Le premier échange est l'occasion de voir ensemble ce que je peux prendre en charge.</p>
          <a href="/contact.html" class="btn btn-primary">Me contacter</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="/js/main.js"></script>
</body>
</html>
