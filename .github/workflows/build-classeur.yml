name: Build Mon Classeur (Windows .exe)
on:
  push:
    paths: ["classeur/**", ".github/workflows/build-classeur.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: classeur } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Vérifier le script de numérisation (PowerShell)
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/electron/scan.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 } else { "scan.ps1 : syntaxe OK" }
          Get-Command powershell.exe | Out-Null
          $dm = New-Object -ComObject WIA.DeviceManager; "WIA disponible, scanners détectés sur le runner : $($dm.DeviceInfos.Count)"
      - run: npm install --no-audit --no-fund
      - run: npm run build:win
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/Mon Classeur-win32-x64" -DestinationPath "Mon-Classeur-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Mon-Classeur-Windows-x64
          path: classeur/Mon-Classeur-Windows.zip
      - name: Publier la version (lien de téléchargement fixe)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: classeur-v1.0.${{ github.run_number }}
          name: Mon Classeur — version ${{ github.run_number }}
          body: |
            Application Windows « Mon Classeur ». Décompressez le zip puis lancez **Mon Classeur.exe**.
          files: classeur/Mon-Classeur-Windows.zip
          make_latest: true
