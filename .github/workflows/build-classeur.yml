name: Build Mon Classeur (Windows .exe)
on:
  push:
    paths: ["classeur/**", ".github/workflows/build-classeur.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: classeur } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Mon-Classeur-Windows-x64
          path: classeur/dist/Mon Classeur-win32-x64
