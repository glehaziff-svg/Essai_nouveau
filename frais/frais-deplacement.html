<title>Frais de déplacement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap">
<style>
:root{
  --fond:#EEF1F4; --papier:#FFFFFF; --encre:#1C2733; --doux:#5A6B7B;
  --trait:#CBD5DF; --trait-fort:#9FB0BF; --bleu:#1F5C8B; --bleu-fort:#17466B;
  --bleu-fonce:#123E5E; --bandeau:#1F5C8B; --tot:#0E4A2F; --tot-fond:#E4F1EA;
  --sans:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root{ --bleu-fort:#17466B; }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --fond:#0F151B; --papier:#182029; --encre:#E6ECF2; --doux:#93A2B2;
    --trait:#2B3844; --trait-fort:#3C4C5A; --bleu:#4C93C9; --bleu-fort:#5AA0D4;
    --bleu-fonce:#2C5B80; --bandeau:#20486A; --tot:#8FE0B4; --tot-fond:#12352A;
  }
}
:root[data-theme="dark"]{
  --fond:#0F151B; --papier:#182029; --encre:#E6ECF2; --doux:#93A2B2;
  --trait:#2B3844; --trait-fort:#3C4C5A; --bleu:#4C93C9; --bleu-fort:#5AA0D4;
  --bleu-fonce:#2C5B80; --bandeau:#20486A; --tot:#8FE0B4; --tot-fond:#12352A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--encre);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.feuille{max-width:900px;margin:24px auto;background:var(--papier);
  border:1px solid var(--trait);border-radius:8px;overflow:hidden;
  box-shadow:0 2px 14px rgba(0,0,0,.06);}

/* ---- barre d'outils (ne s'imprime pas) ---- */
.outils{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:14px 22px;background:var(--fond);border-bottom:1px solid var(--trait);}
.outils .grandit{flex:1}
button{font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;
  border-radius:6px;padding:.6rem 1rem;border:2px solid transparent;}
.btn-imp{background:var(--tot);color:#fff;border-color:var(--tot);}
.btn-imp{background:#146C43;border-color:#146C43;color:#fff;}
.btn-imp:hover{filter:brightness(1.08)}
.btn-add{background:var(--bleu);border-color:var(--bleu);color:#fff}
.btn-add:hover{filter:brightness(1.08)}
.btn-sec{background:transparent;border-color:var(--trait-fort);color:var(--encre)}
.btn-sec:hover{background:var(--fond)}
.btn-enr{background:var(--bleu-fonce);border-color:var(--bleu-fonce);color:#fff}
.btn-enr:hover{filter:brightness(1.12)}
.etat{font-size:14px;font-weight:600;color:#146C43;opacity:0;transition:opacity .2s}
.etat.vu{opacity:1}
button:focus-visible{outline:3px solid var(--bleu-fort);outline-offset:2px}

/* ---- corps ---- */
.corps{padding:26px 30px 34px}
.entete{display:flex;justify-content:space-between;align-items:flex-start;
  gap:20px;border-bottom:3px solid var(--bandeau);padding-bottom:14px;margin-bottom:20px;}
h1{margin:0;font-size:26px;color:var(--bleu-fonce);letter-spacing:.01em}
.entete .sous{margin:4px 0 0;color:var(--doux);font-size:14px}
.ident{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 20px;margin-bottom:22px}
.champ{display:flex;flex-direction:column;gap:4px}
.champ.large{grid-column:1 / -1}
label{font-size:13px;font-weight:600;color:var(--doux);text-transform:uppercase;letter-spacing:.04em}
input, .cellinput{font-family:var(--sans);font-size:16px;color:var(--encre);
  background:var(--papier);border:1px solid var(--trait);border-radius:5px;padding:.5rem .6rem;}
input:focus{outline:2px solid var(--bleu-fort);outline-offset:0;border-color:var(--bleu-fort)}

.taux{display:flex;align-items:center;gap:10px;background:var(--fond);
  border:1px solid var(--trait);border-radius:6px;padding:10px 14px;margin-bottom:18px}
.taux label{margin:0}
.taux input{width:110px;text-align:right}

/* ---- tableau ---- */
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
thead th{background:var(--bandeau);color:#fff;font-size:13px;font-weight:600;
  text-transform:uppercase;letter-spacing:.03em;padding:.6rem .5rem;text-align:left}
thead th.num{text-align:right}
tbody td{border-bottom:1px solid var(--trait);padding:4px 5px;vertical-align:middle}
tbody input,tbody textarea{width:100%;border:1px solid transparent;background:transparent;border-radius:4px}
tbody input:hover,tbody textarea:hover{border-color:var(--trait)}
tbody input.num{text-align:right;font-variant-numeric:tabular-nums}
tbody textarea.motif{font-family:var(--sans);font-size:15px;color:var(--encre);
  resize:vertical;min-height:2.9em;line-height:1.35;padding:.4rem .5rem}
tbody textarea.motif:focus{outline:2px solid var(--bleu-fort);border-color:var(--bleu-fort)}
td.total{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;
  white-space:nowrap;padding-right:8px}
td.sup{width:34px;text-align:center}
.btn-sup{background:transparent;border:0;color:var(--doux);font-size:19px;
  line-height:1;padding:4px 8px;border-radius:5px;cursor:pointer}
.btn-sup:hover{background:#f2d5d5;color:#a12}
tfoot td{padding:.8rem .5rem;font-size:17px}
tfoot .lbl{text-align:right;font-weight:600}
tfoot .grand{text-align:right;font-weight:800;font-size:20px;color:var(--tot);
  background:var(--tot-fond);font-variant-numeric:tabular-nums;white-space:nowrap;
  border-radius:5px}

/* ---- signature ---- */
.pied{display:flex;justify-content:space-between;gap:30px;margin-top:34px}
.pied .bloc{flex:1;font-size:14px;color:var(--doux)}
.pied .ligne-sig{margin-top:52px;border-top:1px solid var(--trait-fort);padding-top:6px}
.sigbloc{display:flex;flex-direction:column;align-items:stretch}
.sig-zone{min-height:80px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.sig-zone img{max-height:90px;max-width:100%;object-fit:contain}
.sig-auto{font-family:"Sacramento",cursive;font-size:44px;line-height:1;
  color:#1B3A63;transform:rotate(-3deg);padding:0 8px 6px;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sig-auto{color:#8FB4D9}}
:root[data-theme="dark"] .sig-auto{color:#8FB4D9}
.sig-legende{border-top:1px solid var(--trait-fort);padding-top:6px;font-size:14px;color:var(--doux)}
.sig-actions{display:flex;gap:8px;margin-top:8px}
.btn-mini{font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid var(--trait-fort);background:var(--papier);color:var(--encre);
  border-radius:5px;padding:.35rem .6rem;display:inline-block}
.btn-mini:hover{background:var(--fond)}
.faitle input{border-bottom:1px solid var(--trait-fort);border-top:0;border-left:0;border-right:0;
  border-radius:0;padding:2px 4px}

/* ---- impression ---- */
@media print{
  body{background:#fff;font-size:12pt}
  .feuille{margin:0;border:0;box-shadow:none;max-width:none;border-radius:0}
  .outils{display:none !important}
  .corps{padding:0}
  .btn-sup{display:none !important}
  .sig-actions{display:none !important}
  td.sup{display:none}
  th.sup-h{display:none}
  input,textarea,.taux{background:#fff !important;color:#000 !important;border-color:#999 !important}
  thead th{background:#1F5C8B !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tfoot .grand{background:#E4F1EA !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  /* largeurs de colonnes fixées à l'impression : le motif prend la place restante */
  table{table-layout:fixed;width:100%}
  thead th:nth-child(1){width:78px}   /* Date */
  thead th:nth-child(3){width:66px}   /* Prix du km */
  thead th:nth-child(4){width:62px}   /* Nombre de km */
  thead th:nth-child(5){width:82px}   /* Total */
  thead th, tbody td{font-size:10.5pt;padding:3px 4px}
  tbody input, tbody textarea{border:0 !important;padding:2px}
  /* le motif s'affiche en entier, sur autant de lignes que nécessaire */
  tbody textarea.motif{height:auto !important;min-height:0 !important;overflow:visible !important;
    white-space:pre-wrap;word-break:break-word;resize:none;font-size:10.5pt;line-height:1.25}
  tr{break-inside:avoid}
  @page{margin:1.4cm}
}
</style>

<div class="feuille">

  <div class="outils">
    <button class="btn-add" id="ajouter">＋ Ajouter une ligne</button>
    <span class="etat" id="etat" aria-live="polite"></span>
    <span class="grandit"></span>
    <button class="btn-sec" id="vider">Tout effacer</button>
    <button class="btn-enr" id="enregistrer">💾 Enregistrer</button>
    <button class="btn-imp" id="imprimer">🖨 Imprimer</button>
  </div>

  <div class="corps">

    <div class="entete">
      <div>
        <h1>Note de frais de déplacement</h1>
        <p class="sous">Indemnités kilométriques</p>
      </div>
      <div style="text-align:right;font-size:14px;color:var(--doux)">
        <div class="champ" style="align-items:flex-end">
          <label for="periode">Période / Année</label>
          <input id="periode" style="width:150px;text-align:right" placeholder="2026">
        </div>
      </div>
    </div>

    <div class="ident">
      <div class="champ large">
        <label for="nom">Nom et prénom</label>
        <input id="nom" placeholder="Votre nom" value="LE HAZIFF Gérald">
      </div>
      <div class="champ large">
        <label for="vehicule">Véhicule</label>
        <input id="vehicule" value="Toyota Yaris hybride 100H">
      </div>
    </div>

    <div class="champ large" style="margin-bottom:18px">
      <label for="trajet">Trajet</label>
      <input id="trajet" value="37 rue du 65ème RI 56000 Vannes à 3 rue du verger 56400 Auray">
    </div>

    <div class="taux">
      <label for="tauxdefaut">Prix du km par défaut (€)</label>
      <input id="tauxdefaut" class="num" type="text" inputmode="decimal" value="0,60">
      <span style="color:var(--doux);font-size:13px">— s'applique à toutes les lignes ; reste modifiable ligne par ligne ensuite.</span>
    </div>

    <div class="tablebox">
    <table>
      <thead>
        <tr>
          <th style="width:96px">Date</th>
          <th>Motif</th>
          <th class="num" style="width:100px">Prix du km</th>
          <th class="num" style="width:100px">Nombre de km</th>
          <th class="num" style="width:120px">Total</th>
          <th class="sup-h" style="width:34px"></th>
        </tr>
      </thead>
      <tbody id="lignes"></tbody>
      <tfoot>
        <tr>
          <td colspan="4" class="lbl">TOTAL À REMBOURSER</td>
          <td class="grand" id="grandtotal">0,00 €</td>
          <td class="sup"></td>
        </tr>
      </tfoot>
    </table>
    </div>

    <div class="pied">
      <div class="bloc faitle" style="white-space:nowrap">
        Fait à <input id="faita" style="width:120px" placeholder="ville">
        &nbsp;le <input id="faitle" style="width:120px" placeholder="jj/mm/aaaa">
      </div>
      <div class="bloc sigbloc">
        <div class="sig-zone">
          <span class="sig-auto" id="sigAuto">Gérald Le Haziff</span>
          <img id="sigImg" alt="Signature" hidden>
        </div>
        <div class="sig-legende">Signature</div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  var MOTIF_DEFAUT = "Restructuration logiciel informatique module : Administration 1/6";
  var CLE = "frais-deplacement-v2";
  var tbody = document.getElementById('lignes');

  function nombre(v){
    if(v==null) return 0;
    v = (""+v).replace(/\s/g,'').replace(',', '.').replace('€','');
    var n = parseFloat(v);
    return isFinite(n) ? n : 0;
  }
  function euros(n){
    return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
  }

  function creerLigne(d){
    d = d || {};
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><input class="date" type="date"></td>' +
      '<td><textarea class="motif" rows="2"></textarea></td>' +
      '<td><input class="prix num" type="text" inputmode="decimal"></td>' +
      '<td><input class="km num" type="text" inputmode="decimal"></td>' +
      '<td class="total">0,00 €</td>' +
      '<td class="sup"><button class="btn-sup" title="Supprimer la ligne" aria-label="Supprimer">✕</button></td>';
    tr.querySelector('.date').value  = d.date  || '';
    tr.querySelector('.motif').value = (d.motif!=null ? d.motif : MOTIF_DEFAUT);
    tr.querySelector('.prix').value  = (d.prix!=null ? d.prix : document.getElementById('tauxdefaut').value);
    tr.querySelector('.km').value    = d.km || '';
    tr.querySelector('.btn-sup').addEventListener('click', function(){
      tr.remove(); recalcul(); sauver();
    });
    var motif = tr.querySelector('.motif');
    motif.addEventListener('input', function(){ ajusterMotif(motif); });
    tr.addEventListener('input', function(){ recalcul(); sauver(); });
    tbody.appendChild(tr);
    ajusterMotif(motif);
    return tr;
  }

  // Le motif grandit pour afficher tout le texte (écran et impression)
  function ajusterMotif(ta){
    ta.style.height = 'auto';
    ta.style.height = (ta.scrollHeight + 2) + 'px';
  }
  function ajusterTousMotifs(){
    tbody.querySelectorAll('textarea.motif').forEach(ajusterMotif);
  }

  function recalcul(){
    var total = 0;
    tbody.querySelectorAll('tr').forEach(function(tr){
      var p = nombre(tr.querySelector('.prix').value);
      var k = nombre(tr.querySelector('.km').value);
      var t = p * k;
      tr.querySelector('.total').textContent = euros(t);
      total += t;
    });
    document.getElementById('grandtotal').textContent = euros(total);
  }

  var CHAMPS = ['nom','vehicule','trajet','periode','tauxdefaut','faita','faitle'];

  var sigImg = document.getElementById('sigImg'),
      sigAuto = document.getElementById('sigAuto');

  function montrerSignature(src){
    if(src){
      sigImg.src = src; sigImg.hidden = false;
      sigAuto.hidden = true;
    } else {
      sigImg.removeAttribute('src'); sigImg.hidden = true;
      sigAuto.hidden = false;
    }
  }

  function sauver(){
    var data = { entete:{}, lignes:[], signature:null };
    CHAMPS.forEach(function(id){ data.entete[id] = document.getElementById(id).value; });
    tbody.querySelectorAll('tr').forEach(function(tr){
      data.lignes.push({
        date: tr.querySelector('.date').value,
        motif: tr.querySelector('.motif').value,
        prix: tr.querySelector('.prix').value,
        km: tr.querySelector('.km').value
      });
    });
    if(!sigImg.hidden && sigImg.src) data.signature = sigImg.src;
    try{ localStorage.setItem(CLE, JSON.stringify(data)); }catch(e){}
  }

  function charger(){
    var data = null;
    try{ data = JSON.parse(localStorage.getItem(CLE)); }catch(e){}
    if(data && data.entete){
      CHAMPS.forEach(function(id){
        if(data.entete[id]!=null) document.getElementById(id).value = data.entete[id];
      });
    }
    if(data && data.signature) montrerSignature(data.signature);
    if(data && data.lignes && data.lignes.length){
      data.lignes.forEach(creerLigne);
    } else {
      creerLigne(); creerLigne(); creerLigne();
    }
    recalcul();
    ajusterTousMotifs();
  }
  window.addEventListener('beforeprint', ajusterTousMotifs);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(ajusterTousMotifs); }

  document.getElementById('ajouter').addEventListener('click', function(){
    creerLigne(); sauver();
  });
  document.getElementById('vider').addEventListener('click', function(){
    if(confirm('Effacer toutes les lignes et repartir de zéro ?')){
      tbody.innerHTML=''; creerLigne(); creerLigne(); creerLigne();
      recalcul(); sauver();
    }
  });
  var etat = document.getElementById('etat'), minuteur;
  function confirmerEnregistrement(){
    etat.textContent = '✓ Enregistré';
    etat.classList.add('vu');
    clearTimeout(minuteur);
    minuteur = setTimeout(function(){ etat.classList.remove('vu'); }, 2500);
  }
  document.getElementById('enregistrer').addEventListener('click', function(){
    sauver(); confirmerEnregistrement();
  });
  document.getElementById('imprimer').addEventListener('click', function(){ window.print(); });
  CHAMPS.forEach(function(id){
    document.getElementById(id).addEventListener('input', sauver);
  });

  // Changer le prix du km en haut applique le nouveau tarif à toutes les lignes
  document.getElementById('tauxdefaut').addEventListener('input', function(){
    var t = this.value;
    tbody.querySelectorAll('tr .prix').forEach(function(champ){ champ.value = t; });
    recalcul(); sauver();
  });

  charger();
})();
</script>
